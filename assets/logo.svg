<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E232B"/>
      <stop offset="1" stop-color="#0D1015"/>
    </linearGradient>
    <linearGradient id="teal" x1="262" y1="220" x2="762" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EE7D8"/>
      <stop offset="1" stop-color="#12A594"/>
    </linearGradient>
    <mask id="wrench" maskUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="478" y="300" width="68" height="176" rx="30" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>

  <!-- the shed: a round-arched doorway -->
  <path d="M262 812 L262 470 A250 250 0 0 1 762 470 L762 812"
        fill="none" stroke="url(#teal)" stroke-width="86" stroke-linecap="round"/>

  <!-- combination wrench, jaw up, standing in the doorway -->
  <g mask="url(#wrench)" fill="#F4F7FA">
    <circle cx="512" cy="470" r="122"/>
    <rect x="474" y="470" width="76" height="300" rx="38"/>
  </g>
</svg>
